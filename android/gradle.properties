# 4G fits a hosted CI runner (about 7 GB of memory) as well as a laptop.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental cache fails when a plugin's sources (pub cache) and
# the project are on different Windows drives. Plugin Kotlin is small, so
# incremental compilation is turned off for a reliable build everywhere.
kotlin.incremental=false
