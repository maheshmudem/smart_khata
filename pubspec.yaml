name: smart_khata
description: "Offline-first Khata, cash book and expense app for Kirana and general stores."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  bloc_concurrency: ^0.3.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.4
  intl: ^0.20.2
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTelugu-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTelugu-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
