include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/generated/**"
    - "build/**"
  errors:
    # Generated-file drift and missing awaits must fail CI, not warn.
    unawaited_futures: error
    invalid_annotation_target: ignore

linter:
  rules:
    # Public API docs are required for packages, not for an app.
    public_member_api_docs: false
    # Money must never pass through double; see docs/engineering/coding-standards.md.
    avoid_print: true
    avoid_dynamic_calls: true
    prefer_const_constructors: true
    prefer_final_locals: true
    lines_longer_than_80_chars: false
