name: Release

# Push a tag like v1.0.0 to build a signed Android App Bundle.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# See docs/engineering/ci-cd.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  release:
    name: Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pubspec version $VERSION."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are not configured. Refusing to produce a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build App Bundle
        # Build number = CI run number, so every upload has a higher versionCode.
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: smart-khata-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols
          retention-days: 90

      - uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: true

      # Uploading to Google Play is deliberately not automated yet. Add it
      # once a Play Console app and a service-account key exist; until then
      # upload the AAB from the draft GitHub release to the internal track.
