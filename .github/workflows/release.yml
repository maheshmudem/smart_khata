name: Release

# Push a tag like v1.0.0 to build a signed Android App Bundle.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# See docs/engineering/ci-cd.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# One release at a time; a second run for the same tag waits rather than
# racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  release:
    name: Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pubspec version $VERSION."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart run drift_dev schema dump lib/core/database/app_database.dart drift_schemas/
          if [ -n "$(git status --porcelain -- lib drift_schemas)" ]; then
            git status --short -- lib drift_schemas
            echo "::error::Generated files are stale."
            exit 1
          fi

      - name: Format, analyze, test, coverage
        run: |
          dart format --output=none --set-exit-if-changed lib test tool integration_test
          flutter analyze --fatal-infos
          flutter test --coverage
          dart run tool/check_coverage.dart

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are not configured. Refusing to produce a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build App Bundle
        # Build number = CI run number, so every upload has a higher versionCode.
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --obfuscate --split-debug-info=build/symbols

      - name: The signed build requests only allowed permissions
        # The bundle and this APK are built from the same manifest.
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          bash tool/check_permissions.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: smart-khata-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Pack the files needed to read crash reports
        # Dart symbols and R8's mapping. Without them a crash report from
        # this build cannot be decoded, so they are kept with the release
        # itself, not only as an artifact that expires.
        run: |
          tar -czf "smart-khata-${GITHUB_REF_NAME}-symbols.tar.gz" \
            build/symbols build/app/outputs/mapping/release/mapping.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            smart-khata-${{ github.ref_name }}-symbols.tar.gz
          generate_release_notes: true
          draft: true

      # Uploading to Google Play is deliberately not automated yet. Add it
      # once a Play Console app and a service-account key exist; until then
      # upload the AAB from the draft GitHub release to the internal track.
