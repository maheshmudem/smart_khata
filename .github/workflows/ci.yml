name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        # --enforce-lockfile: CI builds exactly what pubspec.lock records.
        run: flutter pub get --enforce-lockfile

      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart run drift_dev schema dump lib/core/database/app_database.dart drift_schemas/
          git diff --exit-code -- lib drift_schemas || {
            echo "::error::Generated files are stale. Run build_runner / gen-l10n / schema dump and commit the result."
            exit 1
          }

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Coverage gate (core and domain)
        run: dart run tool/check_coverage.dart

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Android build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Debug APK
        run: flutter build apk --debug

      - name: Release build compiles and has no INTERNET permission
        # Debug-signed here (no keystore in CI for PRs); this proves R8 and
        # the release manifest are sound. Real signing is in release.yml.
        run: |
          flutter build apk --release
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          PERMS="$("$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk)"
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "::error::Release APK requests INTERNET. V1 is offline-only (CLAUDE.md rule 14)."
            exit 1
          fi

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
