name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        # --enforce-lockfile: CI builds exactly what pubspec.lock records.
        run: flutter pub get --enforce-lockfile

      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart run drift_dev schema dump lib/core/database/app_database.dart drift_schemas/
          # --porcelain also lists new files that were never committed,
          # which `git diff` does not see.
          if [ -n "$(git status --porcelain -- lib drift_schemas)" ]; then
            git status --short -- lib drift_schemas
            echo "::error::Generated files are stale. Run build_runner / gen-l10n / schema dump and commit the result."
            exit 1
          fi

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Coverage gate (core, domain and data)
        run: dart run tool/check_coverage.dart

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Android build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Debug APK
        run: flutter build apk --debug

      - name: Release build compiles and requests only allowed permissions
        # Debug-signed on purpose (no keystore in CI for PRs); this proves
        # R8 and the release manifest are sound. It is never published.
        # Real signing is in release.yml.
        env:
          SMART_KHATA_ALLOW_DEBUG_SIGNED_RELEASE: "true"
        run: |
          flutter build apk --release
          bash tool/check_permissions.sh build/app/outputs/flutter-apk/app-release.apk

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
